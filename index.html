<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtitle Converter</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="vendor/bootstrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/constants.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body class="dark-theme">
    <div class="app container">
      <header>
        <h1>Subtitle Converter</h1>
        <p>Convert .SRT or .VTT files into plain text instantly in your browser.</p>
      </header>

      <div class="drop-zone" id="dropZone">
        <label for="fileInput">
          <strong>Drop your subtitle file here</strong>
          <span style="color: var(--muted); font-size: 0.85rem">Supports .srt and .vtt</span>
          <span class="button">Browse File</span>
        </label>
        <input type="file" id="fileInput" accept=".srt,.vtt" />
      </div>

      <div class="editor">
        <div class="editor-header">
          <label for="outputText"><strong>Converted Text</strong></label>
          <div class="editor-actions">
            <button class="button" id="copyBtn" onclick="copyToCB()">Copy Text</button>
            <button class="button" onclick="downloadText()">Download .txt</button>
          </div>
        </div>
        <textarea id="outputText" placeholder="Your converted text will appear here..."></textarea>
      </div>
    </div>
  </body>
</html>
